      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f7ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" fill="url(#bg)" rx="14"/>
  <rect x="0.5" y="0.5" width="1199" height="219" rx="13.5" fill="none" stroke="#e0e7ff"/>

