  <text x="334" y="138" font-size="76" letter-spacing="-3" font-weight="800" fill="#EEF2FF" font-family="'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif">Hans Martens Dev</text>
  <text x="338" y="184" font-size="30" font-weight="500" fill="#E0E7FF" font-family="'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif">Astro Theme Developer &amp; Web Designer</text>

  <line x1="338" y1="208" x2="940" y2="208" stroke="#A5B4FC" stroke-opacity="0.5" stroke-width="1"/>

  <text x="338" y="240" font-size="20" font-weight="500" fill="#E0E7FF" font-family="'Outfit Variable', Outfit, system-ui, -apple-system, sans-serif">hansmartens.dev &#183; open for new projects</text>

