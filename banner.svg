      <stop offset="0" stop-color="#316FFF"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>

    <radialGradient id="brandGlow" cx="700" cy="150" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.40"/>
      <stop offset="0.55" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dotGrid" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#dotGrid)"/>
  <rect width="1200" height="300" fill="url(#brandGlow)"/>

  <line x1="294" y1="64" x2="294" y2="236" stroke="#E0E7FF" stroke-opacity="0.25" stroke-width="1"/>

  <g transform="translate(120, 78)">
