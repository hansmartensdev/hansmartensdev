    <rect x="396" y="240" width="68" height="32" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="430" y="261" text-anchor="middle" fill="#4f46e5">Lucide</text>
    <rect x="476" y="240" width="116" height="32" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="534" y="261" text-anchor="middle" fill="#4f46e5">design systems</text>
  </g>

  <line x1="48" y1="294" x2="1152" y2="294" stroke="#e0e7ff"/>

  <!-- Hosting -->
  <text x="48" y="332" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#6366f1">HOSTING</text>
  <g font-family="'Outfit', system-ui, sans-serif" font-size="13" font-weight="600">
    <rect x="180" y="314" width="76" height="32" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="218" y="335" text-anchor="middle" fill="#4f46e5">Netlify</text>
    <rect x="268" y="314" width="72" height="32" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="304" y="335" text-anchor="middle" fill="#4f46e5">Vercel</text>
    <rect x="352" y="314" width="96" height="32" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="400" y="335" text-anchor="middle" fill="#4f46e5">Cloudflare</text>
    <rect x="460" y="314" width="74" height="32" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="497" y="335" text-anchor="middle" fill="#4f46e5">Resend</text>
  </g>

  <!-- Right side note -->
  <g>
    <rect x="900" y="92" width="252" height="254" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="916" y="120" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#4338ca">// philosophy</text>
    <text x="916" y="156" font-family="'Outfit', system-ui, sans-serif" font-weight="700" font-size="16" letter-spacing="-0.3" fill="#1e1b4b">
      <tspan x="916" dy="0">Pick the boring</tspan>
      <tspan x="916" dy="22">stable thing. Make it</tspan>
      <tspan x="916" dy="22">fast. Make it last.</tspan>
    </text>
    <line x1="916" y1="244" x2="980" y2="244" stroke="#6366f1" stroke-width="2"/>
    <text x="916" y="272" font-family="'Outfit', system-ui, sans-serif" font-size="13" fill="#475569">
      <tspan x="916" dy="0">Hype fades, fundamentals</tspan>
      <tspan x="916" dy="20">compound. Sixteen years in,</tspan>
      <tspan x="916" dy="20">still building for the long run.</tspan>
    </text>
  </g>
