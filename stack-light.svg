<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tech I reach for">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f7ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" fill="url(#bg)" rx="14"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="13.5" fill="none" stroke="#e0e7ff"/>

  <rect x="32" y="28" width="4" height="22" fill="#6366f1" rx="2"/>
  <text x="48" y="46" font-family="'Outfit', system-ui, sans-serif" font-weight="700" font-size="18" letter-spacing="-0.4" fill="#1e1b4b">TECH I REACH FOR</text>
  <text x="1168" y="46" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6366f1">five groups · curated</text>

  <!-- Group rows: label left, chips right. y starts at 92, row height 54 -->

  <!-- Build -->
  <text x="48" y="110" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#6366f1">BUILD</text>
  <g font-family="'Outfit', system-ui, sans-serif" font-size="13" font-weight="600">
    <rect x="180" y="92" width="80" height="32" rx="16" fill="#6366f1"/>
    <text x="220" y="113" text-anchor="middle" fill="#ffffff">Astro</text>
    <rect x="272" y="92" width="64" height="32" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
