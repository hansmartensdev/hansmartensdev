    <rect x="430" y="166" width="56" height="32" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="458" y="187" text-anchor="middle" fill="#4f46e5">MDX</text>
    <rect x="498" y="166" width="64" height="32" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="530" y="187" text-anchor="middle" fill="#4f46e5">React</text>
    <rect x="574" y="166" width="86" height="32" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="617" y="187" text-anchor="middle" fill="#4f46e5">View Trns</text>
  </g>

  <line x1="48" y1="220" x2="1152" y2="220" stroke="#e0e7ff"/>

