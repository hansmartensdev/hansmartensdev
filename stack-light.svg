    <rect x="444" y="92" width="68" height="32" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="478" y="113" text-anchor="middle" fill="#4f46e5">pnpm</text>
    <rect x="524" y="92" width="78" height="32" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="563" y="113" text-anchor="middle" fill="#4f46e5">Vitest</text>
  </g>

  <line x1="48" y1="146" x2="1152" y2="146" stroke="#e0e7ff"/>

  <!-- Frontend -->
  <text x="48" y="184" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#6366f1">FRONTEND</text>
  <g font-family="'Outfit', system-ui, sans-serif" font-size="13" font-weight="600">
    <rect x="180" y="166" width="106" height="32" rx="16" fill="#6366f1"/>
    <text x="233" y="187" text-anchor="middle" fill="#ffffff">TypeScript</text>
    <rect x="298" y="166" width="120" height="32" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
